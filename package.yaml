name:                him
version:             0.1.0.0
license:             BSD-3-Clause
author:              "Joakim Lier"
copyright:           "2026 Joakim Lier"
synopsis:            A modal, selection-first terminal text editor
category:            Editor
description:         Please see docs/PLAN.md

extra-source-files:
- cbits/tree-sitter/include/tree_sitter/*.h
- cbits/tree-sitter/src/*.c
- cbits/tree-sitter/src/*.h
- cbits/tree-sitter/src/**/*.h
- README.md
- CHANGELOG.md
- docs/PLAN.md

language: GHC2021

default-extensions:
- OverloadedStrings
- LambdaCase
- DerivingStrategies

# Only GHC boot libraries are allowed. Add them per-component as they
# become used, so -Wunused-packages stays quiet.
dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -Wunused-packages

library:
  source-dirs: src
  dependencies:
  - array
  - bytestring
  - containers
  - directory
  - filepath
  - process
  - stm
  - text
  - transformers
  - unix
  c-sources:
  - cbits/winsize.c
  - cbits/text.c
  - cbits/ts_runtime.c
  - cbits/ts_shim.c
  include-dirs:
  - cbits/tree-sitter/include
  - cbits/tree-sitter/src
  cc-options:
  - -O2

executables:
  him:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    # The non-moving collector does not need room for a copy of the old
    # generation, so peak memory stays close to the live data (see
    # docs/BENCHMARK.md). Override with `him +RTS ... -RTS`.
    - '"-with-rtsopts=-xn"'
    dependencies:
    - him
    - directory
    - text

tests:
  him-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - him
    - bytestring
    - containers
    - directory
    - filepath
    - stm
    - text
    - transformers
